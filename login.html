<!DOCTYPE html>
<html>
<head>
<title>FM Portal Login</title>

<style>

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#eef4ff;
font-family:'Segoe UI',sans-serif;
}

.login-box{
background:white;
padding:40px;
width:350px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

h2{
color:#002b7f;
margin-bottom:20px;
text-align:center;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:8px;
}

button{
width:100%;
padding:12px;
background:#002b7f;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:600;
}

</style>
</head>
  
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  
<body>

<div class="login-box">

<h2>FM Logistic Portal</h2>

<input type="email" id="email" placeholder="Enter Email">

<input type="password" id="password" placeholder="Enter Password">

<button onclick="login()">Login</button>

</div>

<!-- STEP 1 -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<!-- STEP 2 : PASTE HERE -->

<script>

const firebaseConfig = {
apiKey:"AIzaSyDghYujwS8c8g-wolAklzLufF_j2qzEyDc",
authDomain:"xphther.firebaseapp.com",
projectId:"xphther",
storageBucket:"xphther.firebasestorage.app",
messagingSenderId:"771665767472",
appId:"1:771665767472:web:a1a857d5589de4c38a51f5"
};

firebase.initializeApp(firebaseConfig);

</script>

<!-- STEP 3 : LOGIN FUNCTION -->

<script>

function login(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

firebase.auth()
.signInWithEmailAndPassword(email,password)

.then(function(){

window.location.href="dashboard.html";

})

.catch(function(error){

alert(error.message);

});

}

</script>

</body>
</html>
